server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Vite build output: every filename carries a content hash, so a new deploy
    # always produces a new name. Safe to pin forever.
    # "^~" so this prefix wins over the regex block below: nginx normally gives
    # regex locations priority, which would otherwise pull hashed fonts and svgs
    # out of /assets/ and into the short-TTL rule.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Files copied from public/ keep the same name across deploys (favicon.svg,
    # images/*). Marking these "immutable" pins a stale copy in returning
    # visitors' browsers for a year, even through a hard refresh, so they get a
    # short TTL and revalidate instead.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Vue Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (opcional, se quiser proxy via nginx)
    # location /api {
    #     proxy_pass http://backend:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
