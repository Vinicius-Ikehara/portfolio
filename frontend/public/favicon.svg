<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="vGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8703f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#874726;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#vGradient)"/>

  <!--
    Letter V drawn as an outline instead of <text>. Favicons render in an
    isolated context where fonts are not guaranteed to be available and <text>
    is not reliably rasterized, so a glyph rendered as text can silently come
    out blank. A path always draws.
  -->
  <path
    d="M 24,29 L 47,29 L 47,35 L 41,35 L 52,63 L 64,35 L 58,35 L 58,29 L 78,29 L 78,35 L 71,35 L 57,76 L 46,76 L 30,35 L 24,35 Z"
    fill="white"
  />
</svg>
